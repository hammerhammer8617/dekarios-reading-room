<!doctype html>
<html lang="zh-CN" data-reading-end-resource="static-v4">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>今天读到这里</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: var(--font-sans, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: auto !important;
        min-height: 320px !important;
        margin: 0;
        overflow: visible;
        background: transparent;
      }

      body { padding: 4px; }

      #reading-end-static-v4 {
        width: 100%;
        min-height: 312px;
        margin: 0;
      }

      .card {
        width: min(100%, 620px);
        min-height: 304px;
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #c8bda8;
        border-radius: 18px;
        background: #f6efe1;
        color: #25231f;
        box-shadow: 0 8px 24px rgba(42, 35, 27, 0.1);
      }

      .eyebrow,
      .label,
      .status {
        font-size: 12px;
        line-height: 1.45;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: #805447;
        font-weight: 750;
        letter-spacing: 0.06em;
      }

      h1 {
        margin: 0;
        font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", Georgia, serif;
        font-size: 23px;
        line-height: 1.3;
      }

      .position {
        display: inline-block;
        margin: 8px 0 0;
        padding: 4px 9px;
        border-radius: 999px;
        background: #e9ddc8;
        color: #694d42;
        font-size: 12px;
        font-weight: 650;
      }

      .probe,
      .section {
        margin-top: 16px;
        padding-top: 13px;
        border-top: 1px solid #d9cfbd;
      }

      .probe {
        min-height: 116px;
        padding: 15px;
        border: 1px solid #d9cfbd;
        border-radius: 12px;
        background: #fffaf0;
      }

      .probe strong { font-size: 15px; }

      .probe p,
      .section p {
        margin: 5px 0 0;
        overflow-wrap: anywhere;
        font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", Georgia, serif;
        font-size: 14px;
        line-height: 1.65;
      }

      .label {
        margin: 0;
        color: #805447;
        font-weight: 800;
        letter-spacing: 0.05em;
      }

      .status {
        margin: 17px 0 0;
        color: #706a61;
      }

      [hidden] { display: none !important; }

      @media (prefers-color-scheme: dark) {
        .card { border-color: #5b5145; background: #28241f; color: #f2eadc; }
        .eyebrow, .label { color: #dba995; }
        .position { background: #443a31; color: #ead9c8; }
        .probe { border-color: #5b5145; background: #332d27; }
        .probe, .section { border-color: #5b5145; }
        .status { color: #bdb2a4; }
      }
    </style>
  </head>
  <body>
    <main
      id="reading-end-static-v4"
      data-reading-end-static-v4
      data-reading-end-height-strategy="raw-postmessage-v4"
      data-state="shell"
    >
      <article class="card" aria-live="polite">
        <header>
          <p class="eyebrow">今天读到这里</p>
          <h1 id="reading-end-title">静态收尾卡已加载</h1>
          <p id="reading-end-position" class="position">reading-end-v4 · HTML 可见性探针</p>
        </header>

        <section id="reading-end-probe" class="probe" role="status">
          <strong>如果你看见这张卡，ChatGPT 已经渲染了普通 HTML。</strong>
          <p>它不依赖 React、图片、MCP Apps SDK 或初始化握手；权威快照抵达后，才会替换为本次共读内容。</p>
        </section>

        <div id="reading-end-content" hidden>
          <section class="section">
            <h2 class="label">读到哪里</h2>
            <p id="reading-end-progress"></p>
          </section>
          <section class="section">
            <h2 class="label">今天读了什么</h2>
            <p id="reading-end-summary"></p>
          </section>
          <section class="section" data-optional="tavThought" hidden>
            <h2 class="label">塔芙留下</h2>
            <p data-value="tavThought"></p>
          </section>
          <section class="section" data-optional="galeThought" hidden>
            <h2 class="label">盖尔留下</h2>
            <p data-value="galeThought"></p>
          </section>
          <section class="section" data-optional="openQuestion" hidden>
            <h2 class="label">留到下次</h2>
            <p data-value="openQuestion"></p>
          </section>
        </div>

        <p id="reading-end-status" class="status">等待权威快照；静态外壳已经存在。</p>
      </article>
    </main>
    <script type="module" src="/src/reading-end/static-main.ts"></script>
  </body>
</html>
