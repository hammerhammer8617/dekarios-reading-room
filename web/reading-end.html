<!doctype html>
<html lang="zh-CN" data-reading-end-resource="static-v6">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>今天读到这里</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: var(--font-sans, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: auto !important;
        min-height: 320px !important;
        margin: 0;
        overflow: visible;
        background: transparent;
      }

      body { padding: 4px; }

      #reading-end-static-v6 {
        width: 100%;
        min-height: 312px;
        margin: 0;
      }

      .card {
        position: relative;
        isolation: isolate;
        width: min(100%, 620px);
        min-height: 304px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid #766957;
        border-radius: 18px;
        background: #211c18;
        color: #fff8eb;
        box-shadow: 0 12px 32px rgba(12, 9, 7, 0.24);
      }

      .card-art {
        position: absolute;
        inset: 0;
        z-index: -2;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        transform: scale(1.002);
      }

      .card::after {
        position: absolute;
        inset: 0;
        z-index: -1;
        content: "";
        pointer-events: none;
        background:
          linear-gradient(90deg, rgba(25, 21, 18, 0.96) 0%, rgba(25, 21, 18, 0.9) 36%, rgba(25, 21, 18, 0.66) 66%, rgba(25, 21, 18, 0.18) 100%),
          linear-gradient(0deg, rgba(17, 14, 12, 0.68) 0%, rgba(17, 14, 12, 0.02) 62%);
      }

      .card-paper {
        position: relative;
        z-index: 1;
        width: min(78%, 485px);
        min-height: 304px;
        padding: 20px;
        background: transparent;
        text-shadow: 0 1px 2px rgba(10, 8, 6, 0.42);
      }

      .eyebrow,
      .label,
      .status {
        font-size: 12px;
        line-height: 1.45;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: #f2b49d;
        font-weight: 750;
        letter-spacing: 0.06em;
      }

      h1 {
        margin: 0;
        font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", Georgia, serif;
        font-size: 23px;
        line-height: 1.3;
      }

      .position {
        display: inline-block;
        margin: 8px 0 0;
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid rgba(255, 238, 216, 0.12);
        background: rgba(84, 68, 55, 0.82);
        color: #fff1df;
        backdrop-filter: blur(5px);
        font-size: 12px;
        font-weight: 650;
      }

      .probe,
      .section {
        margin-top: 16px;
        padding-top: 13px;
        border-top: 1px solid rgba(255, 241, 222, 0.28);
      }

      .probe {
        min-height: 116px;
        padding: 15px;
        border: 1px solid rgba(255, 241, 222, 0.24);
        border-radius: 12px;
        background: rgba(35, 29, 24, 0.7);
        backdrop-filter: blur(8px);
      }

      .probe strong { font-size: 15px; }

      .probe p,
      .section p {
        margin: 5px 0 0;
        overflow-wrap: anywhere;
        font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", Georgia, serif;
        font-size: 14px;
        line-height: 1.65;
      }

      .label {
        margin: 0;
        color: #f2b49d;
        font-weight: 800;
        letter-spacing: 0.05em;
      }

      .status {
        margin: 17px 0 0;
        color: rgba(255, 242, 226, 0.72);
      }

      [hidden] { display: none !important; }

      @media (max-width: 520px) {
        .card::after {
          background:
            linear-gradient(180deg, rgba(25, 21, 18, 0.58) 0%, rgba(25, 21, 18, 0.88) 42%, rgba(25, 21, 18, 0.97) 100%),
            linear-gradient(90deg, rgba(25, 21, 18, 0.7), rgba(25, 21, 18, 0.34));
        }

        .card-paper {
          width: 100%;
          min-height: 0;
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main
      id="reading-end-static-v6"
      data-reading-end-static-v6
      data-reading-end-layout="full-bleed-overlay-v6"
      data-reading-end-height-strategy="raw-postmessage-v6"
      data-state="shell"
    >
      <article class="card" aria-live="polite">
        <img id="reading-end-art" class="card-art" alt="" aria-hidden="true" />
        <div class="card-paper">
          <header>
            <p class="eyebrow">今天读到这里</p>
            <h1 id="reading-end-title">静态收尾卡已加载</h1>
            <p id="reading-end-position" class="position">reading-end-v6 · 全幅画面探针</p>
          </header>

          <section id="reading-end-probe" class="probe" role="status">
            <strong>如果你看见这张卡，ChatGPT 已经渲染了图片内嵌的普通 HTML。</strong>
            <p>它不依赖 React 或外部图片请求；权威快照抵达后，才会替换为本次共读内容。</p>
          </section>

          <div id="reading-end-content" hidden>
            <section class="section">
              <h2 class="label">读到哪里</h2>
              <p id="reading-end-progress"></p>
            </section>
            <section class="section">
              <h2 class="label">今天读了什么</h2>
              <p id="reading-end-summary"></p>
            </section>
            <section class="section" data-optional="tavThought" hidden>
              <h2 class="label">塔芙留下</h2>
              <p data-value="tavThought"></p>
            </section>
            <section class="section" data-optional="galeThought" hidden>
              <h2 class="label">盖尔留下</h2>
              <p data-value="galeThought"></p>
            </section>
            <section class="section" data-optional="openQuestion" hidden>
              <h2 class="label">留到下次</h2>
              <p data-value="openQuestion"></p>
            </section>
          </div>

          <p id="reading-end-status" class="status">等待权威快照；静态外壳已经存在。</p>
        </div>
      </article>
    </main>
    <script type="module" src="/src/reading-end/static-main.ts"></script>
  </body>
</html>
