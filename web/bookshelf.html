<!doctype html>
<html lang="zh-CN" data-bookshelf-resource="static-v4">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>德卡里奥斯家的书架</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: var(--font-sans, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: auto !important;
        min-height: 320px !important;
        margin: 0;
        overflow: visible;
        background: transparent;
      }

      body { padding: 4px; }

      #bookshelf-static-v4 {
        width: 100%;
        min-height: 312px;
        margin: 0;
      }

      .shelf {
        width: min(100%, 620px);
        min-height: 304px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid #bbaa8e;
        border-radius: 18px;
        background: #f4ead6;
        color: #25231f;
        box-shadow: 0 8px 24px rgba(42, 35, 27, 0.1);
      }

      .hero {
        position: relative;
        min-height: clamp(176px, 32vw, 196px);
        overflow: hidden;
        background-image: url("/src/assets/reading-room/bookroom-background-static-v3.webp");
        background-position: 50% 0%;
        background-size: cover;
      }

      .hero::before {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(2, 12, 8, 0.03) 10%, rgba(5, 16, 11, 0.14) 48%, rgba(7, 20, 14, 0.84));
        content: "";
      }

      .hero-copy {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 18px 20px 16px;
        color: #fff8e9;
        text-shadow: 0 1px 18px #110d09;
      }

      .hero-copy p { margin: 5px 0 0; font-size: 12px; opacity: 0.88; }
      .body { padding: 18px 20px 20px; }

      .eyebrow,
      .meta,
      .facts,
      .status,
      .detail-label,
      .thought-meta {
        font-size: 12px;
        line-height: 1.5;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: #e7c887;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", Georgia, serif;
      }

      h1 { font-size: 24px; line-height: 1.3; }
      h2 { font-size: 17px; line-height: 1.4; }
      h3 { font-size: 15px; line-height: 1.4; }

      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
      }

      .section-heading > span { color: #706a61; font-size: 12px; }

      .probe {
        min-height: 92px;
        padding: 17px;
        border: 1px solid #d9cfbd;
        border-radius: 13px;
        background: #fffaf0;
      }

      .probe strong { font-size: 15px; }
      .probe p { margin: 5px 0 0; color: #706a61; font-size: 13px; line-height: 1.6; }

      .books {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }

      .book {
        position: relative;
        width: 100%;
        padding: 13px 42px 13px 14px;
        border: 1px solid #d9cfbd;
        border-left: 5px solid #8a5e4b;
        border-radius: 12px;
        background: #fffaf0;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .book::after {
        position: absolute;
        top: 50%;
        right: 15px;
        color: #9a6a45;
        content: "›";
        font-size: 26px;
        line-height: 1;
        transform: translateY(-50%);
      }

      .book:hover { border-color: #b99c78; background: #fffdf7; }
      .book:active { transform: translateY(1px); }
      .book:focus-visible,
      .back:focus-visible,
      .page-button:focus-visible,
      .delete-trigger:focus-visible,
      .delete-cancel:focus-visible,
      .delete-confirm:focus-visible { outline: 3px solid rgba(138, 94, 75, 0.35); outline-offset: 2px; }
      .book:disabled { cursor: wait; opacity: 0.62; }
      .book[data-status="completed"] { border-left-color: #6e7c62; }
      .meta { margin: 3px 0 0; color: #706a61; }
      .position { margin: 9px 0 0; font-size: 14px; line-height: 1.55; }
      .thought {
        display: -webkit-box;
        margin: 7px 0 0;
        overflow: hidden;
        color: #604f44;
        font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", Georgia, serif;
        font-size: 13px;
        line-height: 1.55;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .facts { margin: 8px 0 0; color: #805447; }
      .status { margin: 16px 0 0; color: #706a61; }

      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 12px;
      }

      .page-button,
      .delete-trigger,
      .delete-cancel,
      .delete-confirm {
        border: 1px solid #c9bba5;
        border-radius: 999px;
        background: #fffaf0;
        color: #805447;
        font: 750 12px var(--font-sans, ui-sans-serif, system-ui, sans-serif);
        cursor: pointer;
      }

      .page-button { min-width: 72px; padding: 7px 11px; }
      .page-button:disabled { cursor: default; opacity: 0.42; }
      .page-label { min-width: 64px; color: #706a61; font-size: 12px; text-align: center; }

      .back {
        margin: 0 0 12px;
        padding: 5px 0;
        border: 0;
        background: transparent;
        color: #805447;
        font: 750 13px var(--font-sans, ui-sans-serif, system-ui, sans-serif);
        cursor: pointer;
      }

      .detail-header {
        padding: 16px;
        border: 1px solid #d9cfbd;
        border-radius: 14px;
        background: linear-gradient(135deg, #fffaf0, #eadbc1);
      }

      .detail-header > p { margin: 4px 0 0; color: #706a61; font-size: 13px; }
      .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin-top: 13px; overflow: hidden; border: 1px solid #d9cfbd; border-radius: 11px; background: #d9cfbd; }
      .detail-grid > div { display: flex; min-height: 55px; flex-direction: column; justify-content: center; gap: 2px; padding: 8px 10px; background: rgba(255, 250, 240, 0.94); }
      .detail-label { color: #706a61; }
      .detail-grid strong { font-size: 13px; font-weight: 650; }
      .detail-section { margin-top: 19px; }
      .thought-list { display: grid; gap: 8px; margin-top: 9px; }
      .thought-row { padding: 10px 11px; border-left: 3px solid #8a5e4b; border-radius: 5px 11px 11px 5px; background: #fffaf0; }
      .thought-row[data-author="gale"] { border-left-color: #4e705e; }
      .thought-row[data-author="shared"] { border-left-color: #ae813c; }
      .thought-row p { margin: 5px 0 0; font-size: 13px; line-height: 1.55; }
      .thought-meta { display: flex; gap: 7px; color: #706a61; }
      .thought-meta b { color: #805447; }
      .thought-meta span:last-child { margin-left: auto; }
      .question-list { display: grid; gap: 8px; margin: 9px 0 0; padding: 0; list-style: none; }
      .question-list li { padding: 10px 12px; border-radius: 11px; background: rgba(128, 84, 71, 0.09); font-size: 13px; line-height: 1.55; }
      .reading-caseboard {
        position: relative;
        margin-top: 18px;
        overflow: hidden;
        border: 1px solid #cbbca4;
        border-radius: 14px;
        background:
          linear-gradient(rgba(95, 71, 45, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(95, 71, 45, 0.025) 1px, transparent 1px),
          #eee3cf;
        background-size: 18px 18px;
        box-shadow: inset 0 0 28px rgba(74, 51, 30, 0.08);
      }
      .reading-caseboard::before,
      .reading-caseboard::after {
        position: absolute;
        z-index: 1;
        width: 70px;
        height: 18px;
        background: rgba(211, 192, 155, 0.5);
        content: "";
        transform: rotate(-5deg);
      }
      .reading-caseboard::before { top: 7px; left: 25px; }
      .reading-caseboard::after { right: 25px; bottom: 7px; transform: rotate(4deg); }
      .caseboard-heading {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 14px;
        padding: 20px 18px 14px;
        border-bottom: 1px dashed rgba(80, 59, 38, 0.28);
      }
      .caseboard-heading h3 { margin-top: 4px; font-size: 19px; }
      .caseboard-heading p { margin: 4px 0 0; color: #756958; font-size: 11px; }
      .caseboard-eyebrow { color: #8a5e4b; font: 800 9px/1.2 ui-monospace, monospace; letter-spacing: 0.13em; }
      .caseboard-boundary { display: grid; min-width: 92px; gap: 2px; padding: 8px 10px; border: 1px solid rgba(80, 59, 38, 0.18); background: rgba(255, 251, 240, 0.72); text-align: right; }
      .caseboard-boundary span { color: #756958; font-size: 9px; }
      .caseboard-boundary strong { color: #315d49; font-size: 12px; }
      .caseboard-tabs { position: relative; z-index: 2; display: flex; gap: 5px; overflow-x: auto; padding: 11px 12px 8px; scrollbar-width: none; }
      .caseboard-tabs::-webkit-scrollbar { display: none; }
      .caseboard-tabs button { min-height: 32px; flex: 0 0 auto; padding: 6px 10px; border: 1px solid rgba(93, 73, 51, 0.22); border-radius: 999px; background: rgba(255, 250, 239, 0.62); color: #5d5347; font: 700 11px var(--font-sans, system-ui, sans-serif); cursor: pointer; }
      .caseboard-tabs button[aria-pressed="true"] { border-color: #2f4b3d; background: #2f4b3d; color: #fff8e9; }
      .caseboard-panel { position: relative; z-index: 2; padding: 9px 14px 18px; }
      .caseboard-metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
      .caseboard-metrics > div { display: grid; gap: 2px; padding: 8px 6px; border: 1px solid rgba(91, 69, 46, 0.13); background: rgba(255, 251, 240, 0.72); text-align: center; }
      .caseboard-metrics strong { color: #7e3f3f; font: 700 20px/1 ui-serif, serif; }
      .caseboard-metrics span { color: #756958; font-size: 9px; }
      .caseboard-block { margin-top: 13px; }
      .caseboard-block .section-heading { padding-bottom: 6px; border-bottom: 1px dashed rgba(80, 59, 38, 0.22); }
      .caseboard-block .section-heading h3 { font-size: 13px; }
      .caseboard-note-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-top: 9px; }
      .caseboard-note { position: relative; min-height: 96px; padding: 13px 10px 9px 36px; border: 1px solid rgba(91, 70, 47, 0.15); background: rgba(255, 251, 241, 0.88); box-shadow: 0 5px 11px rgba(65, 46, 29, 0.07); }
      .caseboard-note > i { position: absolute; top: 7px; left: 50%; width: 7px; height: 7px; border-radius: 50%; background: #913b3d; box-shadow: 0 1px 2px rgba(55, 25, 23, 0.35); }
      .caseboard-note > b { position: absolute; top: 14px; left: 11px; color: #a2574d; font: 700 11px ui-serif, serif; }
      .caseboard-note p { margin: 0 0 6px; font-family: ui-serif, "Songti SC", serif; font-size: 11px; line-height: 1.55; }
      .caseboard-note small { color: #837563; font-size: 8px; }
      .caseboard-note[data-status="confirmed"] { border-top: 3px solid #315d49; }
      .caseboard-note[data-status="suspected"] { border-top: 3px solid #9d6b21; }
      .caseboard-note[data-status="disproved"] { opacity: 0.55; text-decoration: line-through; }
      .timeline-block ol { margin: 8px 0 0; padding: 0; list-style: none; }
      .timeline-block li { display: grid; grid-template-columns: 82px 1fr; gap: 2px 8px; padding: 7px 8px 7px 11px; border-left: 2px solid #778873; background: rgba(255, 251, 240, 0.52); }
      .timeline-block li + li { margin-top: 3px; }
      .timeline-block li b { color: #315d49; font-size: 9px; }
      .timeline-block li span { font-size: 10px; }
      .timeline-block li small { grid-column: 2; color: #756958; font-size: 8px; }
      .observation-block ul { display: grid; gap: 5px; margin: 8px 0 0; padding: 0; list-style: none; }
      .observation-block li { padding: 8px 9px 8px 28px; border-left: 3px solid #315d49; background: rgba(255, 251, 240, 0.66); font-size: 10px; line-height: 1.5; }
      .observation-block li::before { margin-left: -18px; margin-right: 8px; color: #315d49; content: "⌕"; }
      .caseboard-vault { display: flex; align-items: center; gap: 9px; margin-top: 13px; padding: 10px; border: 1px dashed rgba(80, 59, 38, 0.3); background: rgba(69, 51, 38, 0.055); }
      .caseboard-vault > span { display: grid; width: 29px; height: 29px; flex: 0 0 29px; place-items: center; border-radius: 50%; background: #352f29; color: #f0dab2; }
      .caseboard-vault > div { display: grid; gap: 2px; }
      .caseboard-vault b { font-size: 11px; }
      .caseboard-vault small { color: #756958; font-size: 9px; }
      .caseboard-graph { overflow: hidden; border: 1px solid rgba(91, 70, 47, 0.18); background: rgba(255, 251, 240, 0.61); }
      .caseboard-graph svg { display: block; width: 100%; height: auto; }
      .graph-line { stroke: #6d746f; stroke-width: 1.5; }
      .graph-line--suspected, .graph-line--unknown { stroke: #a27634; stroke-dasharray: 5 4; }
      .graph-label { fill: #65594c; font: 8px var(--font-sans, system-ui, sans-serif); paint-order: stroke; stroke: #f7efdd; stroke-width: 4px; text-anchor: middle; }
      .graph-entity rect { fill: #fff9ea; stroke: #806d56; stroke-width: 1.2; filter: drop-shadow(0 3px 3px rgba(67, 47, 28, 0.09)); }
      .graph-entity circle { fill: #8e3c3e; }
      .graph-entity--confirmed rect { fill: #e3ead9; stroke: #315d49; }
      .graph-entity--suspected rect { fill: #f0dfbb; stroke: #9d6b21; stroke-dasharray: 4 3; }
      .graph-entity--disproved { opacity: 0.5; text-decoration: line-through; }
      .graph-name { fill: #2b2520; font: 700 10px ui-serif, "Songti SC", serif; }
      .graph-type { fill: #7c6f60; font: 7px var(--font-sans, system-ui, sans-serif); }
      .caseboard-entity-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin-top: 9px; }
      .caseboard-entity-cards article { display: grid; gap: 3px; padding: 9px 10px; border-left: 3px solid #806d56; background: rgba(255, 251, 240, 0.72); }
      .caseboard-entity-cards article[data-status="confirmed"] { border-left-color: #315d49; }
      .caseboard-entity-cards article[data-status="suspected"] { border-left-color: #9d6b21; }
      .caseboard-entity-cards span { color: #756958; font-size: 8px; }
      .caseboard-entity-cards b { font-size: 11px; }
      .caseboard-entity-cards p { margin: 0; color: #5e554a; font-size: 9px; line-height: 1.45; }
      .analysis-ledger { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .analysis-ledger > section { padding: 11px; border: 1px solid rgba(91, 70, 47, 0.16); background: rgba(255, 251, 240, 0.58); }
      .analysis-list { display: grid; gap: 7px; margin-top: 8px; }
      .analysis-list article { position: relative; padding: 9px 9px 8px 34px; border: 1px solid rgba(91, 70, 47, 0.13); background: rgba(255, 251, 240, 0.8); }
      .analysis-list article > b:first-child { position: absolute; top: 11px; left: 9px; color: #9b5047; font: 700 10px ui-serif, serif; }
      .analysis-list article p { margin: 0 0 4px; font-size: 10px; line-height: 1.5; }
      .analysis-list article small { color: #756958; font-size: 8px; }
      .analysis-list article[data-status="rejected"],
      .analysis-list article[data-status="disproved"] { opacity: 0.52; text-decoration: line-through; }
      .theory-list article { padding-left: 10px; border-left: 3px solid #8a5e4b; }
      .theory-list article > b:first-child { position: static; color: #4d3f35; font: 700 11px ui-serif, serif; }
      .caseboard-empty { margin: 8px 0 0; padding: 16px 10px; border: 1px dashed rgba(91, 70, 47, 0.28); color: #756958; font-size: 11px; text-align: center; }
      .danger-zone { margin-top: 21px; padding-top: 14px; border-top: 1px dashed #cfb7aa; }
      .delete-trigger { padding: 7px 12px; border-color: #b67565; background: transparent; color: #994d3b; }
      .delete-confirmation { margin-top: 10px; padding: 12px; border: 1px solid #d8b7aa; border-radius: 12px; background: rgba(153, 77, 59, 0.07); }
      .delete-confirmation p { margin: 0; font-size: 12px; line-height: 1.6; }
      .delete-actions { display: flex; gap: 8px; margin-top: 10px; }
      .delete-cancel, .delete-confirm { padding: 7px 12px; }
      .delete-confirm { border-color: #994d3b; background: #994d3b; color: #fffaf0; }
      .delete-error { margin-top: 8px !important; color: #994d3b; }
      .empty { margin: 9px 0 0; color: #706a61; font-size: 13px; }
      [hidden] { display: none !important; }

      @media (max-width: 520px) {
        .caseboard-heading { align-items: start; flex-direction: column; }
        .caseboard-boundary { text-align: left; }
        .caseboard-note-grid,
        .caseboard-entity-cards,
        .analysis-ledger { grid-template-columns: 1fr; }
        .caseboard-metrics { grid-template-columns: repeat(3, 1fr); }
      }

      @media (prefers-color-scheme: dark) {
        .shelf { border-color: #5b5145; background: #28241f; color: #f2eadc; }
        .body { background: #28241f; }
        .probe, .book, .thought-row { border-color: #5b5145; background: #332d27; }
        .book:hover { border-color: #866f59; background: #3a332c; }
        .meta, .status, .section-heading > span, .detail-header > p, .detail-label, .thought-meta, .empty { color: #bdb2a4; }
        .facts, .back, .page-button, .delete-trigger { color: #dba995; }
        .thought { color: #dccabb; }
        .page-button, .delete-cancel { border-color: #5b5145; background: #332d27; }
        .page-label { color: #bdb2a4; }
        .detail-header { border-color: #5b5145; background: linear-gradient(135deg, #332d27, #453a30); }
        .detail-grid { border-color: #5b5145; background: #5b5145; }
        .detail-grid > div { background: #332d27; }
        .question-list li { background: rgba(219, 169, 149, 0.09); }
        .reading-caseboard { border-color: #5b5145; background: #302b24; }
        .caseboard-heading p,
        .caseboard-boundary span,
        .caseboard-metrics span,
        .caseboard-vault small,
        .caseboard-entity-cards span,
        .caseboard-entity-cards p,
        .analysis-list article small,
        .caseboard-empty { color: #bdb2a4; }
        .caseboard-boundary,
        .caseboard-metrics > div,
        .caseboard-note,
        .timeline-block li,
        .observation-block li,
        .caseboard-graph,
        .caseboard-entity-cards article,
        .analysis-ledger > section,
        .analysis-list article { border-color: #5b5145; background: #383129; }
        .caseboard-tabs button { border-color: #5b5145; background: #383129; color: #d6cab9; }
        .caseboard-tabs button[aria-pressed="true"] { border-color: #6f8b77; background: #476252; color: #fff8e9; }
        .graph-entity rect { fill: #40372e; stroke: #99856d; }
        .graph-entity--confirmed rect { fill: #35473d; stroke: #6f927e; }
        .graph-name { fill: #f2eadc; }
        .graph-type, .graph-label { fill: #c4b7a8; stroke: #302b24; }
        .danger-zone { border-color: #665149; }
        .delete-confirmation { border-color: #704f45; background: rgba(219, 169, 149, 0.07); }
        .delete-confirm { border-color: #a95f4d; background: #a95f4d; color: #fffaf0; }
        .delete-error { color: #e0a28f; }
      }
    </style>
  </head>
  <body>
    <main
      id="bookshelf-static-v4"
      data-bookshelf-static-v4
      data-bookshelf-height-strategy="raw-postmessage-v4"
      data-state="shell"
    >
      <article class="shelf" aria-live="polite">
        <header class="hero">
          <div class="hero-copy">
            <p class="eyebrow">Dekarios Reading Room</p>
            <h1>德卡里奥斯家的书房</h1>
            <p>我们共同读过的地方，都留在这里。</p>
          </div>
        </header>

        <div class="body">
          <section id="bookshelf-probe" class="probe" role="status">
            <strong>正在从书架上取书……</strong>
            <p>轻量书架已经抵达，正在接住共读记录。</p>
          </section>

          <section id="bookshelf-content" hidden>
            <div class="section-heading">
              <h2 id="bookshelf-title">我们的书架</h2>
              <span id="bookshelf-count"></span>
            </div>
            <div id="bookshelf-list" class="books" aria-label="书架作品"></div>
            <nav id="bookshelf-pagination" class="pagination" aria-label="书架分页" hidden>
              <button id="bookshelf-previous" class="page-button" type="button">上一页</button>
              <span id="bookshelf-page" class="page-label" aria-live="polite"></span>
              <button id="bookshelf-next" class="page-button" type="button">下一页</button>
            </nav>
          </section>

          <section id="bookshelf-detail" hidden></section>
          <p id="bookshelf-status" class="status" aria-live="polite">等待书架工具结果。</p>
        </div>
      </article>
    </main>
    <script type="module" src="/src/bookshelf/static-main.ts"></script>
  </body>
</html>
