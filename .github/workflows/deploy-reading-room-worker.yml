name: Deploy reading room Worker

on:
  workflow_dispatch:
  push:
    branches:
      - feat/gtd-reading-room
    paths:
      - .github/deploy-reading-room-worker.trigger

permissions:
  contents: read

concurrency:
  group: reading-room-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MCP_PATH_TOKEN: ${{ secrets.MCP_PATH_TOKEN }}

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/gtd-reading-room
          fetch-depth: 0

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$MCP_PATH_TOKEN" || { echo "Missing MCP_PATH_TOKEN"; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Apply D1 migrations
        run: pnpm --filter @ss/server exec wrangler d1 migrations apply ss-reading-nest-db --remote

      - name: Prepare Worker secret file
        shell: bash
        run: |
          umask 077
          printf 'MCP_PATH_TOKEN=%s\n' "$MCP_PATH_TOKEN" > server/.deploy.secrets

      - name: Deploy Worker
        run: pnpm --filter @ss/server exec wrangler deploy --secrets-file .deploy.secrets

      - name: Remove temporary secret file
        if: always()
        run: rm -f server/.deploy.secrets
