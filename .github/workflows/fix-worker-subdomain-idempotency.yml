name: Fix Worker subdomain idempotency

on:
  push:
    branches:
      - feat/gtd-reading-room
    paths:
      - .github/fix-worker-subdomain-idempotency.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/gtd-reading-room
          fetch-depth: 0

      - name: Patch deploy workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/deploy-reading-room-worker.yml')
          text = path.read_text()
          old = '''          echo "$response" | jq -e '.success == true' >/dev/null || {
            echo "Cloudflare rejected the workers.dev subdomain request."
            echo "$response" | jq '{errors, messages}'
            exit 1
          }
          echo "workers.dev account subdomain configured."
'''
          new = '''          if echo "$response" | jq -e '.success == true' >/dev/null; then
            echo "workers.dev account subdomain configured."
          elif echo "$response" | jq -e 'any(.errors[]?; .code == 10036)' >/dev/null; then
            echo "workers.dev account subdomain already exists; continuing."
          else
            echo "Cloudflare rejected the workers.dev subdomain request."
            echo "$response" | jq '{errors, messages}'
            exit 1
          fi
'''
          if old not in text:
            raise SystemExit('Expected workers.dev block not found')
          path.write_text(text.replace(old, new, 1))

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-reading-room-worker.yml
          git commit -m "ci(cloudflare): tolerate existing workers.dev subdomain"
          git push origin HEAD:feat/gtd-reading-room
