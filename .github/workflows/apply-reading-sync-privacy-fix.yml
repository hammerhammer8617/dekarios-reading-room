name: Apply reading sync privacy fix

on:
  push:
    branches:
      - feat/gtd-reading-room
    paths:
      - .github/apply-reading-sync-privacy-fix.trigger

permissions:
  contents: write

concurrency:
  group: apply-reading-sync-privacy-fix
  cancel-in-progress: false

jobs:
  patch-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/gtd-reading-room
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply privacy patch
        shell: python
        run: |
          from pathlib import Path

          def replace_required(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Expected source block not found: {label}")
              return text.replace(old, new, 1)

          messages_path = Path("web/src/features/reading-sync/build-messages.ts")
          messages = messages_path.read_text()
          messages = replace_required(
              messages,
              '''    `只简短回复：“已读到第 ${batch.rangeEnd} 段。”`,
              "",
              batch.text
            ].join("\\n");
          }
          ''',
              '''    `只简短回复：“已读到第 ${batch.rangeEnd} 段。”`
            ].join("\\n");
          }

          export function buildBatchFallbackChatMessage(job: ReadingSyncJob, batch: SyncBatch) {
            return [buildBatchChatMessage(job, batch), "", batch.text].join("\\n");
          }
          ''',
              "buildBatchChatMessage body"
          )
          messages_path.write_text(messages)

          app_path = Path("web/src/App.tsx")
          app = app_path.read_text()
          app = replace_required(
              app,
              '''  buildBatchChatMessage,
            buildBatchUserNote,''',
              '''  buildBatchChatMessage,
            buildBatchFallbackChatMessage,
            buildBatchUserNote,''',
              "App import"
          )

          included_marker = "        includedText: batch.text,"
          marker_position = app.find(included_marker)
          if marker_position < 0:
              raise SystemExit("Expected source marker not found: includedText batch")

          block_start_marker = '      await callTool("send_current_context", {'
          block_start = app.rfind(block_start_marker, 0, marker_position)
          if block_start < 0:
              raise SystemExit("Expected source block start not found: novel send_current_context")

          block_end_marker = '      await askChatGpt(buildBatchChatMessage(job, batch), { scrollToBottom: false });'
          block_end_start = app.find(block_end_marker, marker_position)
          if block_end_start < 0:
              raise SystemExit("Expected source block end not found: novel visible prompt")
          block_end = block_end_start + len(block_end_marker)

          replacement = '''      const result = await callTool("send_current_context", {
            sessionId: job.sessionId,
            previousSyncedPosition: job.confirmedThrough,
            currentPosition: job.targetPosition,
            contextRange: { start: batch.rangeStart, end: batch.rangeEnd },
            includedText: batch.text,
            userNote: buildBatchUserNote(job, batch),
            ...(sourceContext ? { sourceContext } : {}),
            mode: "range_sync",
            batch: {
              id: batch.id,
              ordinal: batch.ordinal,
              total: batch.totalBatches,
              rangeStart: batch.rangeStart,
              rangeEnd: batch.rangeEnd,
              hasMore: !batch.isFinal
            }
          });
          const context = result.structuredContent?.context as Record<string, unknown> | undefined;
          if (context) {
            await syncCurrentContext({
              context,
              successPrompt: buildBatchChatMessage(job, batch),
              fallbackPrompt: buildBatchFallbackChatMessage(job, batch),
              updateModelContext,
              sendMessage: askChatGpt
            });
          } else {
            await askChatGpt(buildBatchFallbackChatMessage(job, batch), {
              scrollToBottom: false
            });
          }'''
          app = app[:block_start] + replacement + app[block_end:]
          app_path.write_text(app)

          tests_path = Path("web/src/features/reading-sync/build-messages.test.ts")
          tests = tests_path.read_text()
          tests = replace_required(
              tests,
              '''  buildBatchChatMessage,
            buildBatchUserNote,''',
              '''  buildBatchChatMessage,
            buildBatchFallbackChatMessage,
            buildBatchUserNote,''',
              "test import"
          )
          tests = replace_required(
              tests,
              "    expect(message).toContain(batch.text);",
              "    expect(message).not.toContain(batch.text);",
              "success prompt privacy assertion"
          )
          tests = replace_required(
              tests,
              '''  it("puts only factual synchronization metadata in userNote", () => {''',
              '''  it("includes source text only in the compatibility fallback message", () => {
            const message = buildBatchFallbackChatMessage(job, batch);

            expect(message).toContain("【补课第 1/4 批：第 3–8 段】");
            expect(message).toContain("只简短回复：“已读到第 8 段。”");
            expect(message).toContain(batch.text);
          });

          it("puts only factual synchronization metadata in userNote", () => {''',
              "fallback test insertion"
          )
          tests_path.write_text(tests)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Trigger Worker deployment
        shell: bash
        run: date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/deploy-reading-room-worker.trigger

      - name: Commit and push verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx \
            web/src/features/reading-sync/build-messages.ts \
            web/src/features/reading-sync/build-messages.test.ts \
            .github/deploy-reading-room-worker.trigger
          git commit -m "fix(reader): keep catch-up text out of visible chat"
          git push origin HEAD:feat/gtd-reading-room
