name: Build reading room preview

on:
  push:
    branches:
      - feat/gtd-reading-room

permissions:
  contents: write

concurrency:
  group: reading-room-preview
  cancel-in-progress: true

jobs:
  verify-build-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip preview build]') }}
    runs-on: ubuntu-latest
    env:
      VITE_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/gtd-reading-room
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit Worker bundle size
        run: pnpm --filter @ss/server audit:worker-size

      - name: Refresh Pages bundle
        run: |
          mkdir -p docs
          cp web/dist/index.html docs/index.html
          mkdir -p docs/bindery
          cp -R bindery/dist/. docs/bindery/

      - name: Commit generated preview
        run: |
          if git diff --quiet -- docs/index.html docs/bindery; then
            echo "Pages bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/bindery
          git commit -m "build(pages): refresh reading room preview [skip preview build]"
          git push origin HEAD:feat/gtd-reading-room
